services:
  api:
    image: !reset null
    build:
      context: ${CMS_CORE_PATH:-../..}
      dockerfile: api/Dockerfile.dev
    volumes:
      - ${CMS_CORE_PATH:-../..}:/app
      - /app/node_modules
    command: npm run dev --workspace=api

  admin:
    image: !reset null
    build:
      context: ${CMS_CORE_PATH:-../..}
      dockerfile: admin/Dockerfile.dev
    working_dir: /app
    volumes:
      - ${CMS_CORE_PATH:-../..}:/app
      - /app/node_modules
      - /app/admin/.next
    command: npm run dev --workspace=admin
