services:
  api:
    container_name: ${PROJECT_NAME}-api
    image: ${CMS_REGISTRY:-ghcr.io/kaan35}/cms-api:${CMS_TAG:-latest}
    restart: ${RESTART_POLICY:-unless-stopped}
    env_file: .env
    environment:
      - PORT=3001
      - PLUGINS=${PLUGINS:-full}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  mongo:
    container_name: ${PROJECT_NAME}-mongo
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-cms}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: ${PROJECT_NAME}-redis
    image: redis:8
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
