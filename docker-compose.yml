name: ${PROJECT_NAME:-cms}

services:
  mongo:
    container_name: ${PROJECT_NAME:-cms}-mongo
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    container_name: ${PROJECT_NAME:-cms}-redis
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    container_name: ${PROJECT_NAME:-cms}-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    container_name: ${PROJECT_NAME:-cms}-api
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/core/node_modules
      - /app/packages/db/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/plugins/plugin-auth/api/node_modules
      - /app/api/node_modules
    env_file:
      - ./api/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/${MONGO_DB_NAME:-cms_dev}
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  minio_data:
