name: ${PROJECT_NAME:-cms}

services:
  mongo:
    container_name: ${PROJECT_NAME:-cms}-mongo
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    container_name: ${PROJECT_NAME:-cms}-redis
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    container_name: ${PROJECT_NAME:-cms}-api
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/core/node_modules
      - /app/packages/db/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/api/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3001}
      - HOST=${HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/cms_dev}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-cms_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
