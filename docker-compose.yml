name: ${PROJECT_NAME:-cms}

services:
  mongo:
    container_name: ${PROJECT_NAME:-cms}-mongo
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    container_name: ${PROJECT_NAME:-cms}-redis
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    container_name: ${PROJECT_NAME:-cms}-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    container_name: ${PROJECT_NAME:-cms}-api
    build:
      context: .
      dockerfile: ${API_DOCKERFILE:-api/Dockerfile.dev}
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  admin:
    container_name: ${PROJECT_NAME:-cms}-admin
    build:
      context: .
      dockerfile: ${ADMIN_DOCKERFILE:-admin/Dockerfile.dev}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3002}:3002"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy

  client:
    container_name: ${PROJECT_NAME:-cms}-client
    build:
      context: .
      dockerfile: ${CLIENT_DOCKERFILE:-client-template/Dockerfile.dev}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3003}:3003"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  minio_data:
