name: cms-test

services:
  mongo-test:
    container_name: cms-mongo-test
    image: mongo:8
    restart: "no"
    ports:
      - "${TEST_MONGO_PORT:-27019}:27017"
    tmpfs:
      - /data/db
    environment:
      MONGO_INITDB_DATABASE: cms_test
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  redis-test:
    container_name: cms-redis-test
    image: redis:8
    restart: "no"
    ports:
      - "${TEST_REDIS_PORT:-6381}:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
